# Einstellungen für Netlify (https://www.netlify.com).
# Repository dort verbinden – Build und Veröffentlichung laufen dann automatisch.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------
# SICHERHEITS-HEADER für alle Seiten
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Nur eigene Inhalte dürfen geladen und ausgeführt werden – keine fremden Skripte,
    # keine Einbettung der Seite in fremde Seiten. Wird ein Formulardienst angebunden,
    # dessen Adresse bei connect-src und form-action ergänzen.
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    # Verbindung ausschließlich verschlüsselt (ein Jahr)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Die Seite braucht weder Kamera noch Mikrofon, Standort usw.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # VORSCHAU: Suchmaschinen aussperren, solange Platzhalter auf der Seite stehen.
    # Diese eine Zeile vor dem echten Livegang entfernen.
    X-Robots-Tag = "noindex, nofollow"

# Dateien mit Prüfsumme im Namen dürfen lange zwischengespeichert werden.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------
# UMLEITUNG: Die echte Website läuft bei STRATO.
# Jeder Aufruf der Netlify-Adresse geht dauerhaft (301) auf dieselbe
# Seite unter www.hadie-immobilien.de. Zum Wiederherstellen der
# Netlify-Vorschau diesen Block löschen.
# ---------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "https://www.hadie-immobilien.de/:splat"
  status = 301
  force = true
